name: Loom CI — Build Corpus & Release

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "URL to training video dataset (tar.gz)"
        default: ""
        required: false
      max_videos:
        description: "Max videos to process"
        default: "5000"
        required: false
      target_size_mb:
        description: "Target .vid size in MB"
        default: "1000"
        required: false

env:
  PYTHON_VERSION: "3.11"
  VID_FILE: "loom-corpus.vid"

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      vid_artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download or generate training dataset
        run: |
          if [ -n "${{ github.event.inputs.dataset_url }}" ]; then
            echo "Downloading dataset from URL..."
            mkdir -p data/videos
            wget -q -O data/dataset.tar.gz "${{ github.event.inputs.dataset_url }}"
            tar -xzf data/dataset.tar.gz -C data/videos/
          else
            echo "No dataset URL provided. Generating synthetic test videos..."
            python scripts/generate_test_videos.py --output_dir data/videos --num_videos 10 --frames 48
          fi

      - name: Build corpus
        run: |
          python corpus.py \
            --input_dir data/videos \
            --output ${{ env.VID_FILE }} \
            --max_videos ${{ github.event.inputs.max_videos || 5000 }} \
            --target_size ${{ github.event.inputs.target_size_mb || 1000 }}

      - name: Verify corpus size
        run: |
          SIZE_MB=$(du -m ${{ env.VID_FILE }} | cut -f1)
          echo "Corpus size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 1100 ]; then
            echo "::error::Corpus exceeds 1.1GB limit"
            exit 1
          fi
          echo "::notice::Size check passed: ${SIZE_MB}MB"

      - name: Upload corpus artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: loom-corpus
          path: ${{ env.VID_FILE }}
          retention-days: 30

  test:
    needs: build-corpus
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download corpus
        uses: actions/download-artifact@v4
        with:
          name: loom-corpus

      - name: Run inference tests
        run: |
          python inference.py --vid ${{ env.VID_FILE }} --prompt "ocean waves at sunset with panning camera" --output test_sunset.mp4 --width 480 --height 272 --frames 48 --seed 42
          python inference.py --vid ${{ env.VID_FILE }} --prompt "forest path dolly camera golden hour" --output test_forest.mp4 --width 480 --height 272 --frames 48 --seed 123

      - name: Verify outputs
        shell: bash
        run: |
          for f in test_sunset.mp4 test_forest.mp4; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing output: $f"
              exit 1
            fi
            SIZE=$(du -k "$f" | cut -f1)
            echo "$f: ${SIZE}KB"
          done
          echo "::notice::All inference tests passed on ${{ matrix.os }}"

  benchmark:
    needs: build-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download corpus
        uses: actions/download-artifact@v4
        with:
          name: loom-corpus

      - name: Run benchmarks
        run: |
          python -c "
          import time
          import sys
          sys.path.insert(0, '.')
          from loom import LoomEngine
          
          engine = LoomEngine('${{ env.VID_FILE }}')
          
          resolutions = [(480, 272), (854, 480)]
          for w, h in resolutions:
              start = time.time()
              frames = engine.synthesize('ocean sunset', width=w, height=h, num_frames=24, seed=42)
              elapsed = time.time() - start
              print(f'Resolution {w}x{h}: {elapsed:.2f}s ({24/elapsed:.1f} fps)')
          "

  release:
    needs: [build-corpus, test, benchmark]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download corpus
        uses: actions/download-artifact@v4
        with:
          name: loom-corpus

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.VID_FILE }}
          body: |
            ## Loom Video Synthesizer ${{ github.ref_name }}
            
            A non-parametric video generation engine. No neural networks. Pure algorithms.
            
            ### Quick Start
            ```bash
            pip install -r requirements.txt
            python inference.py --vid loom-corpus.vid --prompt "ocean waves at sunset" --output video.mp4
            ```
            
            ### Performance
            - 480p, 5s video: ~5-15s on modern CPU
            - 720p, 5s video: ~15-30s on modern CPU
            - No GPU required